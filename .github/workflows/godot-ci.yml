name: "godot-ci export"
on: push

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: test-project
  PROJECT_PATH: test-project

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          sudo mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

      # --- ÉTAPE ITCH.IO ---
      - name: Deploy to Itch.io 🎲
        uses: dulvui/itchio-butler-upload@v1.1.0
        with:
          api-key:: ${{ secrets.ITCHIO_API_KEY }}
          
          working-directory: build/web
          
          user: OrbitOwlGames
          
          game: ci-test
          
          channel: html5
